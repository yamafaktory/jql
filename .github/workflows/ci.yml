name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  shell-tests:
    name: shell tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Test pipe
        run: |
          out=$(echo '{"a":4}' | ./target/debug/jql '"a"')
          [ "$out" = 4 ]
      - name: Test raw-string flag
        run: |
          out=$(echo '{"foo":"bar"}' | ./target/debug/jql '"foo"' -r)
          [ "$out" = bar ]
      - name: Test sort-keys flag
        run: |
          out=$(echo '{"root":{"d":1,"b":{"y":1,"x":2},"a":3}}' | ./target/debug/jql '"root"' -i -S)
          [ "$out" = '{"a":3,"b":{"x":2,"y":1},"d":1}' ]
      - name: Test heredoc
        run: |
          ./target/debug/jql -i '"one"[2:0],"two","three"' > heredoc.out <<EOF
          {
            "one": [1, 2, 3],
            "two": 2,
            "three": 3
          }
          {
            "one": [4, 5, 6],
            "two": 2,
            "three": 3
          }
          EOF
          [ "$(cat heredoc.out)" = "$(printf '%s\n' '[[3,2,1],2,3]' '[[6,5,4],2,3]')" ]
      - name: Test streaming flag
        run: |
          out=$(for i in {1..10}; do echo '{"foo": 2}'; sleep 1; done | ./target/debug/jql '!' -s)
          [ "$out" = "$(for i in {1..10}; do echo '{}'; done)" ]
      - name: Test validate flag
        run: |
          out=$(echo '{"foo":"bar"}' | ./target/debug/jql -v)
          [ "$out" = "Valid JSON file or content" ]
          if out=$(echo '{"foo:"bar"}' | ./target/debug/jql -v 2>&1); then exit 1; fi
          [ "$out" = "Invalid JSON file or content" ]
      - name: Test broken pipe
        run: |
          jq -nc '[range(300000)]' > large.json
          ./target/debug/jql '..' < large.json | head -c 1 > /dev/null
      - name: Test query
        run: |
          echo '"foo"' > selectors.txt
          out=$(echo '{"foo":"bar"}' | ./target/debug/jql -q selectors.txt)
          [ "$out" = '"bar"' ]

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rebuild the website and check that it is up to date
        run: |
          cargo build --release -p jql
          python3 docs/build.py
          git diff --exit-code docs/index.html

  bench:
    if: "!contains(github.ref, 'refs/heads/main')"
    name: bench
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The baseline is measured on main, which a shallow clone can't reach.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Run the benchmarks against the current branch, main and compare
        run: |
          cargo bench --bench benchmark -- --noplot --save-baseline current
          git checkout --detach origin/main
          cargo bench --bench benchmark -- --noplot --save-baseline main
          cargo install critcmp --locked --version 0.1.8
          critcmp main current
