[package]
authors.workspace = true
categories.workspace = true
description = "Runner for jql - the JSON Query Language tool."
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "jql-runner"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
indexmap = { version = "2.14.2", features = ["rayon"] }
jql-parser = { path = "../jql-parser", version = "8.3.0" }
rayon = "1.12.0"
serde = { version = "1.0.229", default-features = false }
serde_json.workspace = true
serde_stacker = "0.1.14"
simd-json = { version = "0.18.1", default-features = false, features = [
	"runtime-detection",
] }
thiserror.workspace = true

[dev-dependencies]
criterion = "0.8.2"

[lib]
path = "src/lib.rs"

[[bench]]
harness = false
name = "benchmark"
path = "benches/benchmark.rs"
